[project]
name = "physzzy-zotero-arxiv-daily"
version = "1.1.0"
description = "Pinned upstream arXiv digest with free local Qwen summaries"
requires-python = ">=3.13"
dependencies = [
    "zotero-arxiv-daily @ https://github.com/TideDra/zotero-arxiv-daily/archive/35c23ec44617b7595b30ac8e5bf4326c6cfd2336.zip",
    "llama-cpp-python>=0.3.2",
    "torch",
]

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8.4.1"]
