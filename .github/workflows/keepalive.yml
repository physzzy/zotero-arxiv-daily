name: Keepalive

on:
  schedule:
    - cron: "0 0 * * 1"   # 每周一 00:00 UTC（日本 09:00）
  workflow_dispatch:

permissions:
  contents: write  # 关键：允许提交代码

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Keep alive
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          commit_message: "chore: keepalive"
