name: Keepalive

on:
  schedule:
    - cron: "17 0 * * 1"  # 每周一 08:17（新加坡／北京时间）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive-default-branch
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update keepalive timestamp on the default branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const { data: repository } = await github.rest.repos.get(context.repo);
            const branch = repository.default_branch;
            if (context.ref !== `refs/heads/${branch}`) {
              throw new Error("Run keepalive from the default branch only.");
            }

            const path = ".github/KEEPALIVE.log";
            let sha;
            try {
              const { data: file } = await github.rest.repos.getContent({
                ...context.repo, path, ref: branch
              });
              if (Array.isArray(file) || file.type !== "file") {
                throw new Error("The keepalive path must be a file.");
              }
              sha = file.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const { data: result } = await github.rest.repos.createOrUpdateFileContents({
              ...context.repo,
              path,
              branch,
              message: "chore: keep scheduled workflows active",
              content: Buffer.from(new Date().toISOString() + "\n").toString("base64"),
              ...(sha ? { sha } : {})
            });
            core.notice(`Updated ${branch}/${path}: ${result.commit.html_url}`);
