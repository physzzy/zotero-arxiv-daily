name: Keepalive via PR

on:
  schedule:
    - cron: "0 0 * * 1"   # 每周一 00:00 UTC（日本 09:00）
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Touch keepalive file
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" >> .github/KEEPALIVE.log

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: keepalive"
          title: "chore: keepalive"
          body: "Automated keepalive PR"
          branch: keepalive-bot
          delete-branch: true
