name: Send emails daily

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: check
      delivery_date:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      mode:
        description: 'check never sends mail; afternoon holds delivery until 15:00 Beijing'
        type: choice
        required: true
        default: check
        options:
          - check
          - afternoon
          - send_now
      delivery_date:
        description: 'Optional Beijing date, YYYY-MM-DD; historical dates are rejected'
        type: string
        required: false
  schedule:
    - cron: '17 5 * * *' # 13:17 Beijing; GitHub may start scheduled runs late

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-arxiv-mail
  cancel-in-progress: false

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.7'
          python-version: '3.13'
          enable-cache: true

      - name: Generate digest or validate without sending
        id: digest
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          ZOTERO_IGNORE: ${{ vars.ZOTERO_IGNORE }}
          SEND_EMPTY: ${{ vars.SEND_EMPTY }}
          ARXIV_QUERY: ${{ secrets.ARXIV_QUERY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          MAX_PAPER_NUM: ${{ secrets.MAX_PAPER_NUM }}
          LANGUAGE: ${{ vars.LANGUAGE }}
          GITHUB_TOKEN: ${{ github.token }}
          DELIVERY_MODE: ${{ github.event_name == 'schedule' && 'afternoon' || inputs.mode }}
          DELIVERY_DATE: ${{ inputs.delivery_date }}
          DELIVERY_RECEIPT: '_maintenance/delivery.json'
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
        run: |
          if [ "$DELIVERY_MODE" = "check" ]; then
            uv run --locked main.py --check
          else
            uv run --locked main.py
          fi

      - name: Preserve delivery receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: arxiv-delivery-${{ steps.digest.outputs.date || 'failed' }}-${{ github.run_id }}
          path: _maintenance/delivery.json
          if-no-files-found: warn
          retention-days: 30
